name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate optional geo database
        run: node scripts/validate-geo.mjs
      - name: Validate scenes
        run: node scripts/validate-scene.mjs
